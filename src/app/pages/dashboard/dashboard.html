<body class="dashboardBody">
        <app-menulateral></app-menulateral>

        <main class="dashboardMain">
            <div class="cards">
                <div class="card">
                    <div class="cardTitulo">Veículo</div>
                    <select class="selecaoDeVeiculo" name="modelo">
                        <option value="">Selecione um modelo</option>
                    </select>
                </div>
 
                <div class="card">
                    <div class="cardTitulo">Total de Vendas</div>
                    <div class="cardValor" id="totalVendas">CONECTA A API PORRA</div>
                    <div class="cardLabel"> Unid.</div>
                </div>
                
                <div class="card">
                    <div class="cardTitulo">Conectados</div>
                    <div class="cardValor" id="totalConectados">CONECTA DESGRAÇA</div>
                    <div class="cardLabel"> Unid.</div>
                </div>
                
                <div class="card">
                    <div class="cardTitulo">Update Software</div>
                    <div class="cardValor" id="totalUpdate">EU N TO BEM AAAAAAAAAAAAAAAAAAAAAAAA</div>
                    <div class="cardLabel"> Unid.</div>
                </div>
            </div>
 
            <div class="imgDisplayVeiculoAtual">
                <!--Troca saporra aqui por favor // CONECTA A API INFERNO-->
                <img class="imgVeiculo" src="img/broncoSport.png" alt="">
            </div>
 
            <div class="tabela">
                <input type="text" class="tableSearch" placeholder="Buscar por código do veículo (VIN)">
                <table class="tabelaVeiculo">
                    <thead class="cabecalhoTabelaVeiculo">
                        <tr>
                            <th>Código - Vin</th>
                            <th>Odômetro</th>
                            <th>Nível de Combustível</th>
                            <th>Status</th>
                            <th>Lat.</th>
                            <th>Long.</th>
                        </tr>
                    </thead>
                    <tbody id="dataVeiculo">
                        <tr>
                            <td>Teste</td>
                            <td>Teste</td>
                            <td>Teste</td>
                            <td>Teste</td>
                            <td>Teste</td>
                            <td>Teste</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
</body>
