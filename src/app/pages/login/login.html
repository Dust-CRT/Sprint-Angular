<body>
    <div class="main">
        <div class="banner">
            <img class="bannerImg" src="img/ranger.png" alt="Logo ford">
        </div>
        
        <div class="sidebar">
            <div class="logo">
                <img class="logoImg" src="img/ford.png" alt="Logo ford">
            </div>

            <div class="conteudoLogin">
                <p class="titulo">Boas-vindas</p>
    
                <div class="login">
                    <form class="loginForm" #loginFrom = "ngForm" (ngSubmit) = "login()">
                        <input type="email" name="email" [(ngModel)]="usuario.nome" class="fordform" required>
                        <input type="password" name="senha" [(ngModel)]="usuario.senha" class="fordform" required>
    
                        <div class="autologin">
                            <label for="autoLogin">Logar automaticamente</label>
                            <input type="checkbox" id="autoLogin" name="autoLogin">
                        </div>
    
                        <button type="submit" class="btnEntrar">Entrar</button>
                    </form>
                </div>                
            </div>
        </div>
    </div>
</body>
